<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d16"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background with squircle rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Document Page Base -->
  <path d="M140 100 H300 L372 172 V412 H140 Z" fill="#131826" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  <path d="M300 100 V172 H372" fill="#1e2638" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Accent Curves / Pen Vector -->
  <path d="M180 240 H332" stroke="url(#primaryGrad)" stroke-width="16" stroke-linecap="round"/>
  <path d="M180 290 H332" stroke="rgba(255,255,255,0.25)" stroke-width="12" stroke-linecap="round"/>
  <path d="M180 340 H270" stroke="rgba(255,255,255,0.25)" stroke-width="12" stroke-linecap="round"/>

  <!-- Sparkle AI Star -->
  <path d="M360 300 Q360 330 390 330 Q360 330 360 360 Q360 330 330 330 Q360 330 360 300 Z" fill="url(#primaryGrad)"/>
  <circle cx="360" cy="330" r="4" fill="#ffffff"/>
</svg>
